name: build-std (Quartus Standard via Wine)

# Experimental job: compiles with Quartus Prime Standard 18.1 running under
# Wine inside a private ghcr image (ghcr.io/musiq-da/quartus-wine:18.1).
# Runs on every push to main (parallel to the Lite build in build.yml) and
# on manual dispatch.
#
# Licensing: this edition needs a node-locked FlexLM license. The container's
# NIC ID is its eth0 MAC, which Docker randomises per run -- so the run pins
# --mac-address and the license's HOSTID must equal it. The file comes from
# the QUARTUS_LICENSE_DAT secret (base64 of license.dat); if its HOSTID is
# still the XXXXXXXXXXXX placeholder it is rewritten to the pinned MAC at
# staging time. This is now THE bitstream build -- the Lite job in build.yml
# was retired when this one went licensed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quartus-std:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore incremental compile database
        # The qsf carries INCREMENTAL_COMPILATION FULL_INCREMENTAL_COMPILATION
        # with a POST_FIT / PLACEMENT_AND_ROUTING Top partition, so Quartus
        # reuses last run's fit for unchanged logic -- as long as the db
        # survives, which a fresh checkout does not give it. Every run saves
        # under a unique key and restores the newest one by prefix, so a
        # small RTL change does not pay a full refit. Bump the v1 prefix to
        # throw away a suspect db.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/db
            fpga/incremental_db
          key: quartus-incdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quartus-incdb-v1-

      - name: Free disk space
        # 6 GB compressed image -- the default runner has ~14 GB usable,
        # so drop the preinstalled SDK cruft first.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Make workspace writable for the container user
        # The image runs Quartus as an unprivileged user whose uid does not
        # match the runner's, so the bind-mounted checkout must be open.
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u musiq-da --password-stdin

      - name: Pull Quartus Standard (Wine) image
        run: docker pull ghcr.io/musiq-da/quartus-wine:18.1

      - name: Stage license.dat and pin the container MAC to its HOSTID
        id: lic
        env:
          B64: ${{ secrets.QUARTUS_LICENSE_DAT }}
        run: |
          [ -n "$B64" ] || { echo "::error::secret QUARTUS_LICENSE_DAT is empty"; exit 1; }
          echo "$B64" | base64 -d > "$RUNNER_TEMP/license.dat"
          if grep -qE 'HOSTID=[0-9A-Fa-f]{12}' "$RUNNER_TEMP/license.dat"; then
            MAC_HEX=$(grep -oE 'HOSTID=[0-9A-Fa-f]{12}' "$RUNNER_TEMP/license.dat" | head -1 | cut -d= -f2 | tr a-f A-F)
          else
            MAC_HEX=0242AC110002
            LC_ALL=C sed -i.bak "s/HOSTID=[^[:space:]]*/HOSTID=$MAC_HEX/g" "$RUNNER_TEMP/license.dat"
          fi
          MAC=$(echo "$MAC_HEX" | sed 's/\(..\)/\1:/g; s/:$//' | tr A-F a-f)
          echo "mac=$MAC" >> "$GITHUB_OUTPUT"
          echo "license staged; container MAC: $MAC"

      - name: Compile (quartus_sh --flow compile, Wine)
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1 \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sh.exe" \
            --flow compile ap_core

      - name: SDRAM interface is actually timed (not just "green")
        # The workspace is /work, which Wine exposes as Z:\work; the tcl
        # scripts therefore go in as Z:\work\scripts\*.tcl.
        if: always()
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1 \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sta.exe" \
            -t "Z:\\work\\scripts\\check_sdram_paths.tcl" ap_core

      - name: Detailed STA of the CPU-domain violations
        # The summary panel shows the chipset clock at -27.9 ns with a TNS of
        # -29,331: thousands of paths the metal cannot close. The netlist is
        # right here with its database -- dump the worst of them, with full
        # node detail, so the fix has names.
        if: always()
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1 \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sta.exe" \
            -t "Z:\\work\\scripts\\sta_cpu_paths.tcl" ap_core || true
          ls -la fpga/sta_cpu*.txt fpga/sta_pico*.txt 2>/dev/null || true

      - name: Show fit summary
        if: always()
        run: |
          grep -A14 "Logic utilization" fpga/output_files/ap_core.fit.rpt 2>/dev/null | head -4 || true
          grep -E "Total (registers|block memory bits|RAM Blocks|DSP Blocks|PLLs)" \
            fpga/output_files/ap_core.fit.rpt 2>/dev/null || true
          grep -iE "evaluation mode" fpga/output_files/*.smsg \
            fpga/output_files/*.rpt 2>/dev/null | head -5 || true
          ls -la fpga/output_files/ 2>/dev/null || true

      - name: Upload bitstream and reports
        # Licensed now: .sof/.rbf must be there -- a silent eval-mode
        # regression would otherwise pass with reports only.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quartus-std-bitstream
          if-no-files-found: error
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.rbf
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/output_files/*.smsg
            fpga/output_files/*.sta.rpt
            fpga/sta_cpu_*.txt
            fpga/sta_pico_*.txt
            fpga/sta_sdram_*.txt

      - name: Save incremental compile database
        # always(): a red SDRAM timing gate still leaves a perfectly good
        # post-fit db behind -- exactly the state the next fix wants to
        # resume from.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/db
            fpga/incremental_db
          key: quartus-incdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
