name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages:read is for the quartus-std job's ghcr image pull; the other jobs
# get the same token scope, which is read-only anyway.
permissions:
  contents: read
  packages: read

jobs:

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Core elaborates — no implicit nets, no undeclared names
        # Quartus carries default_nettype none into core_top, so an undeclared
        # name is a hard error there and a fifteen-minute compile dies; the
        # sims never compile core_top or the CHIPSET at all, and Verilator
        # itself only warns (%Warning-IMPLICIT).  Two Quartus runs and one
        # silently-dead TVRAM later, this is the gate.
        run: ./scripts/lint_core.sh

      - name: SDRAM controller — integrity and single-port bandwidth
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_mp \
            -Isim -Ifpga/core \
            sim/tb_sdram_mp.sv sim/sdram_model.sv \
            fpga/core/sdram_mp.sv \
            -o tb --Mdir obj_mp
          ./obj_mp/tb | tee mp.log
          grep -q "RESULT: PASS" mp.log

      - name: SDRAM controller — three-port contention bandwidth
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_load \
            -Isim -Ifpga/core \
            sim/tb_sdram_load.sv sim/sdram_model.sv \
            fpga/core/sdram_mp.sv \
            -o tbl --Mdir obj_load
          ./obj_load/tbl | tee load.log
          grep -q "RESULT: PASS" load.log
      - name: SDRAM controller — sdram_single shim handshake
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_shim \
            -Isim -Ifpga/core \
            sim/tb_sdram_shim.sv sim/sdram_model.sv \
            fpga/core/sdram_shim.sv \
            fpga/core/sdram_mp.sv \
            -o tbs --Mdir obj_shim
          ./obj_shim/tbs | tee shim.log
          grep -q "RESULT: PASS" shim.log

      - name: RAM.sv integration — sdram_single reference then sdram_mp
        run: |
          S=fpga/core
          for mode in ref mp; do
            DEF=""; [ "$mode" = "mp" ] && DEF="+define+SDRAM_USE_MP"
            verilator --binary --timing -Wno-fatal --top-module tb_ram_ab $DEF \
              -Isim -I$S -I$S/chipset/HDL -I$S/chipset/HDL/sdram_single/HDL \
              sim/tb_ram_ab.sv sim/sdram_model.sv \
              $S/chipset/HDL/RAM.sv $S/chipset/HDL/sdram_single/HDL/sdram_single.sv \
              $S/sdram_shim.sv $S/sdram_mp.sv \
              -o r --Mdir obj_$mode
            ./obj_$mode/r | tee ram_$mode.log
            grep -q "RESULT: PASS" ram_$mode.log
          done

      - name: ROM image lands where it should (no address folding)
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_bios_map \
            -Isim sim/tb_bios_map.sv -o m --Mdir obj_map
          ./obj_map/m | tee map.log
          grep -q "RESULT: PASS" map.log

      - name: TVRAM keeps characters and attributes apart
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_tvram \
            -Isim -Ifpga/core \
            sim/tb_pc98_tvram.sv fpga/core/pc98_tvram.sv \
            -o v --Mdir obj_tv
          ./obj_tv/v | tee tv.log
          grep -q "RESULT: PASS" tv.log

      - name: the CG window serves a glyph to the guest
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_cgwindow \
            -Isim -I$S sim/tb_pc98_cgwindow.sv \
            $S/pc98_cgwindow.sv $S/pc98_glyph_addr.sv -o c --Mdir obj_cg
          ./obj_cg/c | tee cg.log
          grep -q "RESULT: PASS" cg.log

      - name: a pulse survives the clock crossing
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pulse_cdc \
            -Isim -Ifpga/core \
            sim/tb_pulse_cdc.sv fpga/core/pulse_cdc.sv \
            -o p --Mdir obj_cdc
          ./obj_cdc/p | tee cdc.log
          grep -q "RESULT: PASS" cdc.log

      - name: glyphs come back out of SDRAM intact
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_font_sdram \
            -Isim -I$S sim/tb_pc98_font_sdram.sv sim/sdram_model.sv \
            $S/pc98_glyph_rowbuf.sv $S/pc98_glyph_addr.sv \
            $S/pc98_font_fetch.sv $S/sdram_mp.sv \
            -o f --Mdir obj_fs
          ./obj_fs/f | tee fs.log
          grep -q "RESULT: PASS" fs.log

      - name: a text row's glyphs land in the buffer, kanji paired
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_rowbuf \
            -Isim -Ifpga/core sim/tb_pc98_rowbuf.sv \
            fpga/core/pc98_glyph_rowbuf.sv \
            fpga/core/pc98_glyph_addr.sv \
            -o b --Mdir obj_rb
          ./obj_rb/b | tee rb.log
          grep -q "RESULT: PASS" rb.log

      - name: glyph addresses match a real FONT.ROM
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_glyph_addr \
            -Isim -Ifpga/core \
            sim/tb_pc98_glyph_addr.sv fpga/core/pc98_glyph_addr.sv \
            -o g --Mdir obj_ga
          ./obj_ga/g | tee ga.log
          grep -q "RESULT: PASS" ga.log

      - name: port 0x68 drives the ANK/kanji mode the row buffer honours
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gdc_mode1 \
            -Isim -Ifpga/core \
            sim/tb_pc98_gdc_mode1.sv fpga/core/pc98_gdc_mode1.sv \
            -o m --Mdir obj_m1
          ./obj_m1/m | tee m1.log
          grep -q "RESULT: PASS" m1.log

      - name: raster is the 640x400 one PC-98 software expects
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_timing \
            -Isim -Ifpga/core \
            sim/tb_pc98_timing.sv fpga/core/pc98_video_timing.sv \
            -o r --Mdir obj_ti
          ./obj_ti/r | tee ti.log
          grep -q "RESULT: PASS" ti.log

      - name: the OSD's coordinates reach the OSD's window
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_osdwin \
            -DMACHINE_PC98=1 -DPC98_OSD_MARK=1 \
            -Isim -I$S sim/tb_pc98_osdwin.sv \
            $S/pocket_video.sv $S/pc98_video_timing.sv \
            fpga/apf/common.v $S/video_sync_guard.sv \
            $S/common/jtframe_credits.v $S/common/jtframe_dual_ram.v \
            $S/common/jtframe_ram.v \
            -o w --Mdir obj_ow
          ./obj_ow/w | tee ow.log
          grep -q "^PASS" ow.log

      - name: text plane draws what TVRAM says
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_text \
            -Isim -Ifpga/core \
            sim/tb_pc98_text.sv fpga/core/pc98_text_render.sv \
            -o x --Mdir obj_tx
          ./obj_tx/x | tee tx.log
          grep -q "RESULT: PASS" tx.log

      - name: the first cell of a line is drawn, not lost to the blanking
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_firstcell \
            -Isim -Ifpga/core \
            sim/tb_pc98_firstcell.sv fpga/core/pc98_text_render.sv \
            -o q --Mdir obj_fc
          ./obj_fc/q | tee fc.log
          grep -q "RESULT: PASS" fc.log

      - name: the boot beep reaches the speaker pin (ctr1, sysport bit3)
        run: |
          H=fpga/core/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_beep \
            -Isim -I$H/i8253/HDL \
            sim/tb_pc98_beep.sv \
            $H/i8253/HDL/i8253.sv $H/i8253/HDL/i8253_Control_Logic.sv \
            $H/i8253/HDL/i8253_Counter.sv \
            -o b --Mdir obj_beep
          ./obj_beep/b | tee beep.log
          grep -q "RESULT: PASS" beep.log

      - name: Set-2 keys translate to PC-98 make/break codes
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_kbd_ps2 \
            -Isim -Ifpga/core \
            sim/tb_pc98_kbd_ps2.sv fpga/core/pc98_kbd_ps2.sv \
            -o k --Mdir obj_kb
          ./obj_kb/k | tee kb.log
          grep -q "RESULT: PASS" kb.log

      - name: ITF bank switches on 0x043D and not on a glitch
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_itf_bank \
            -Isim sim/tb_itf_bank.sv -o t --Mdir obj_itf
          ./obj_itf/t | tee itf.log
          grep -q "RESULT: PASS" itf.log

      - name: keyboard 8251 answers the way the ROMs ask
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_kbd8251 \
            -Isim -Ifpga/core \
            sim/tb_pc98_kbd8251.sv fpga/core/pc98_kbd8251.sv \
            -o k --Mdir obj_kbd
          ./obj_kbd/k | tee kbd.log
          grep -q "RESULT: PASS" kbd.log

      - name: the V30 rides the 8288 world through the bridge (fast memory)
        run: |
          # v30u_ucrom $readmemh's its tables from HEXDIR "hdl/rtl/ucore/"
          # relative to the working directory; stage them (an empty ROM is
          # a $fatal inside the core, not a warning).
          mkdir -p hdl/rtl/ucore
          cp fpga/core/v30/ucrom.hex \
             fpga/core/v30/ucdecode.hex hdl/rtl/ucore/
          S=fpga/core
          K=$S/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_v30_bridge \
            -Isim -I$S -I$S/v30 -I$K -I$K/i8288/HDL -I$K/i8259/HDL \
            sim/tb_v30_bridge.sv \
            $S/v30/v30u_ss_pkg.sv $S/v30/v30_core.sv $S/v30/v30u_biu.sv \
            $S/v30/v30u_eu.sv $S/v30/v30u_ucrom.sv \
            $S/v30_cpu_bridge.sv \
            $K/ce_generator.sv $K/i8288/HDL/i8288.sv $K/Ready.sv \
            $K/i8259/HDL/i8259.sv $K/i8259/HDL/i8259_Bus_Control_Logic.sv \
            $K/i8259/HDL/i8259_Control_Logic.sv $K/i8259/HDL/i8259_In_Service.sv \
            $K/i8259/HDL/i8259_Interrupt_Request.sv \
            $K/i8259/HDL/i8259_Priority_Resolver.sv \
            -o v --Mdir obj_v30br
          ./obj_v30br/v +slow=0 | tee v30br.log
          grep -q "RESULT: PASS" v30br.log

      - name: the V30 rides the 8288 world through the bridge (wait states)
        run: |
          ./obj_v30br/v +slow=12 | tee v30br_slow.log
          grep -q "RESULT: PASS" v30br_slow.log

      - name: a bare V30's T2 sample still lands after the FDC answers
        run: |
          # The nuV30 latches ad_i at T2->T3, as early as two clk_chipset
          # after io_read_command_n falls.  If a peripheral's read answer is
          # staged deeper than that the CPU reads the previous byte -- this
          # is the race that made the BIOS's seek drain see a phantom
          # "not busy" and wedge.  The bench runs SPECIFY/RECALIBRATE x4/
          # SENSE-drain through the real core + 8288 + glue + floppy and
          # checks every byte the program stored.
          S=fpga/core
          K=$S/chipset/HDL
          V=$S/v30
          mkdir -p hdl/rtl/ucore && cp $V/ucrom.hex $V/ucdecode.hex hdl/rtl/ucore/
          verilator --binary --timing -Wno-fatal --top-module tb_v30_fdcrd \
            -Isim -I$S -I$V -I$K -I$K/i8288/HDL \
            sim/tb_v30_fdcrd.sv \
            $V/v30u_ss_pkg.sv $V/v30_core.sv $V/v30u_biu.sv $V/v30u_eu.sv \
            $V/v30u_ucrom.sv $S/pc98_fdc_glue.sv \
            $S/common/floppy.v $S/common/simple_fifo.v \
            $K/ce_generator.sv $K/i8288/HDL/i8288.sv \
            -o fdcrd --Mdir obj_fdcrd
          ./obj_fdcrd/fdcrd | tee fdcrd.log
          grep -q "RESULT: PASS" fdcrd.log

      - name: no two OSD fields overlap
        run: python3 scripts/check_osd_layout.py

      - name: the virtual keyboard's tables are sane
        run: python3 scripts/check_vkb_layout.py

      - name: no module input left dangling in core_top
        run: python3 scripts/check_unconnected.py

      - name: POST monitor captures what the guest wrote
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_post_monitor \
            -Isim -I$S sim/tb_post_monitor.sv $S/post_monitor.sv -o p --Mdir obj_pm
          ./obj_pm/p | tee pm.log
          grep -q "RESULT: PASS" pm.log

      - name: IRQ0 is an edge, not a level, on a timer pin latched high
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          for tb in tb_pic_irq0_edge tb_pit_boot_seq tb_pic_cascade; do
            verilator --binary --timing -Wno-fatal --top-module $tb \
              -Isim -I$S -I$H -I$H/i8253/HDL -I$H/i8259/HDL \
              sim/$tb.sv -o e --Mdir obj_$tb
            ./obj_$tb/e | tee $tb.log
            grep -q "RESULT: PASS\|PASS tb_" $tb.log
          done

      - name: 8088 read timing (the check every other bench was missing)
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          for mode in ref mp mp_ref; do
            DEF="+define+SDRAM_USE_MP"
            [ "$mode" = ref ] && DEF=""
            [ "$mode" = mp_ref ] && DEF="+define+SDRAM_USE_MP+SDRAM_MP_REF"
            verilator --binary --timing -Wno-fatal --top-module tb_cpu_timing $DEF \
              -Isim -I$S -I$H -I$H/sdram_single/HDL \
              sim/tb_cpu_timing.sv sim/sdram_board_model.sv sim/sdram_model.sv \
              $H/RAM.sv $H/sdram_single/HDL/sdram_single.sv $S/sdram_shim.sv $S/sdram_mp.sv \
              -o c --Mdir obj_ct_$mode
            ./obj_ct_$mode/c | tee ct_$mode.log
            grep -q "RESULT: PASS" ct_$mode.log
          done

      - name: the V30 on the real memory path, at every CE index
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          V=$S/v30
          mkdir -p hdl/rtl/ucore && cp $V/ucrom.hex $V/ucdecode.hex hdl/rtl/ucore/
          verilator --binary --timing -Wno-fatal --top-module tb_v30_mem \
            +define+CPU_V30+V30_BACKDOOR+MACHINE_PC98+SDRAM_USE_MP \
            -O2 -Isim -I$S -I$V -I$H -I$H/i8288/HDL \
            sim/tb_v30_mem.sv \
            $V/v30u_ss_pkg.sv $V/v30_core.sv $V/v30u_biu.sv $V/v30u_eu.sv \
            $V/v30u_ucrom.sv $S/v30_cpu_bridge.sv \
            $S/sdram_shim.sv $S/sdram_mp.sv \
            sim/sdram_board_model.sv sim/sdram_model.sv \
            $H/RAM.sv $H/Ready.sv $H/ce_generator.sv $H/i8288/HDL/i8288.sv \
            -o vm --Mdir obj_vm
          for sp in 0 1 2 3; do
            ./obj_vm/vm +speed=$sp | tee vm_$sp.log
            grep -q "PASS tb_v30_mem" vm_$sp.log
          done

      - name: the GDC puts parameters where np2kai puts them
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gdc \
            -Isim -I$S sim/tb_pc98_gdc.sv $S/pc98_gdc.sv -o g --Mdir obj_gdc
          ./obj_gdc/g | tee gdc.log
          grep -q "PASS tb_pc98_gdc" gdc.log

      - name: the PC-98 FDC ports land on floppy.v's register file
        run: |
          S=fpga/core
          # -I$S/common because the bench now instantiates the REAL floppy.v
          # and drives the BIOS's own sequence through it, rather than checking
          # the mapping against an imagined controller.
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_fdc_glue \
            -Isim -I$S -I$S/common \
            sim/tb_pc98_fdc_glue.sv $S/pc98_fdc_glue.sv \
            sim/tb_fdd_dma_model.sv -o fg --Mdir obj_fdcglue
          ./obj_fdcglue/fg | tee fdcglue.log
          grep -q "PASS tb_pc98_fdc_glue" fdcglue.log

      - name: the SCSI register window indexes and increments like the board
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_scsi \
            -Isim -I$S sim/tb_pc98_scsi.sv $S/pc98_scsi.sv -o sc --Mdir obj_scsi
          ./obj_scsi/sc | tee scsi.log
          grep -q "PASS tb_pc98_scsi" scsi.log

      - name: the GRCG's three operations match np2kai's expressions
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_grcg \
            -Isim -I$S sim/tb_pc98_grcg.sv $S/pc98_grcg.sv -o gr --Mdir obj_grcg
          ./obj_grcg/gr | tee grcg.log
          grep -q "PASS tb_pc98_grcg" grcg.log

      - name: one guest GVRAM access becomes the right several to memory
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gvram_seq \
            -Isim -I$S sim/tb_pc98_gvram_seq.sv $S/pc98_gvram_seq.sv \
            $S/pc98_egc.sv -o gs --Mdir obj_gseq
          ./obj_gseq/gs | tee gseq.log
          grep -q "PASS tb_pc98_gvram_seq" gseq.log

      - name: the EGC's colour, raster ops and access page match np2kai
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_egc \
            -Isim -I$S sim/tb_pc98_egc.sv $S/pc98_gvram_seq.sv \
            $S/pc98_egc.sv -o eg --Mdir obj_egc
          ./obj_egc/eg | tee egc.log
          grep -q "PASS tb_pc98_egc" egc.log

      - name: CE generator makes the frequencies the speed menu names
        run: |
          H=fpga/core/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_ce_rates \
            -Isim -I$H sim/tb_ce_rates.sv $H/ce_generator.sv \
            -o ce --Mdir obj_ce
          ./obj_ce/ce | tee ce.log
          grep -q "PASS tb_ce_rates" ce.log

      - name: postmon ROM peek reads the ROM the loader wrote (not the ITF shadow)
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          # fixed: the shipped flag mux -- the peek must read the main bank,
          # BAD 000. repro: the pre-fix mux -- must come back BAD 0EC with GOT
          # all zeros, i.e. this bench reproduces the hardware readout; if it
          # does not, the bench models nothing and its PASS means nothing.
          for variant in fixed repro; do
            DEF="+define+MACHINE_PC98+SDRAM_USE_MP"
            [ "$variant" = repro ] && DEF="+define+MACHINE_PC98+SDRAM_USE_MP+REPRO_OLD_SHADOW"
            verilator --binary --timing -Wno-fatal --top-module tb_postmon_peek $DEF \
              -Isim -I$S -I$H -I$H/sdram_single/HDL -I$H/upd71071/HDL -I$H/i8288/HDL \
              sim/tb_postmon_peek.sv sim/sdram_model.sv sim/sdram_board_model.sv \
              $S/sdram_selftest_master.sv \
              $H/RAM.sv $H/Bus_Arbiter.sv $H/sdram_single/HDL/sdram_single.sv \
              $S/sdram_shim.sv $S/sdram_mp.sv \
              $H/i8288/HDL/i8288.sv \
              $H/upd71071/HDL/upd71071.sv \
              $H/upd71071/HDL/upd71071_Address_And_Count_Registers.sv \
              $H/upd71071/HDL/upd71071_Bus_Control_Logic.sv \
              $H/upd71071/HDL/upd71071_Priority_Encoder.sv \
              $H/upd71071/HDL/upd71071_Timing_And_Control.sv \
              -o q --Mdir obj_pk_$variant
            (cd sim && ../obj_pk_$variant/q | tee ../pk_$variant.log)
            grep -q "RESULT: PASS" pk_$variant.log
          done

      - name: RAM.sv integration at board timing (antiphase device clock)
        run: |
          S=fpga/core
          for mode in ref mp; do
            DEF=""; [ "$mode" = "mp" ] && DEF="+define+SDRAM_USE_MP"
            verilator --binary --timing -Wno-fatal --top-module tb_ram_ab_ph $DEF \
              -Isim -I$S -I$S/chipset/HDL -I$S/chipset/HDL/sdram_single/HDL \
              sim/tb_ram_ab_ph.sv sim/sdram_model.sv sim/sdram_board_model.sv \
              $S/chipset/HDL/RAM.sv $S/chipset/HDL/sdram_single/HDL/sdram_single.sv \
              $S/sdram_shim.sv $S/sdram_mp.sv \
              -o p --Mdir obj_ph_$mode
            ./obj_ph_$mode/p | tee ram_ph_$mode.log
            grep -q "RESULT: PASS" ram_ph_$mode.log
          done

  firmware:
    # firmware.vh is committed and the Quartus build $readmemh's it, so nothing
    # rebuilds it automatically: edit the C, forget to run make, and the
    # bitstream silently ships a stale softcore ROM.
    #
    # The first version of this job rebuilt the firmware here and diffed the
    # image. That does not work -- run#61 failed it on 1012 of 1179 lines, which
    # was not staleness but Ubuntu's clang laying the same sources out
    # differently from the Homebrew LLVM the committed image was built with.
    #
    # So compare a fingerprint of the SOURCES instead. make writes
    # firmware.srchash next to firmware.vh; if it still matches the sources in
    # the tree, the committed image came from these sources. Toolchain
    # independent for the hash itself, but srchash-verify gates on
    # nodiv-verify, which links the image (ld.lld) and disassembles it
    # (llvm-objdump) -- the runner's clang comes without lld, so install the
    # linker and the LLVM binutils or the job dies at the link.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM linker and binutils
        run: sudo apt-get update && sudo apt-get install -y lld llvm

      - name: firmware.vh was built from the committed sources
        run: make -C firmware srchash-verify

  quartus-std:
    # Compiles with Quartus Prime Standard 18.1 running under Wine inside a
    # private ghcr image (ghcr.io/musiq-da/quartus-wine:18.1-slim) -- THE bitstream
    # build; the raetro/quartus:pocket Lite job that lived here was retired.
    #
    # Licensing: this edition needs a node-locked FlexLM license. The
    # container's NIC ID is its eth0 MAC, which Docker randomises per run --
    # so the run pins --mac-address and the license's HOSTID must equal it.
    # The file comes from the QUARTUS_LICENSE_DAT secret (base64 of
    # license.dat); if its HOSTID is still the XXXXXXXXXXXX placeholder it is
    # rewritten to the pinned MAC at staging time.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore incremental compile database
        # The qsf carries INCREMENTAL_COMPILATION FULL_INCREMENTAL_COMPILATION
        # with a POST_FIT / PLACEMENT_AND_ROUTING Top partition -- but the db
        # itself no longer rides the cache: every restored db, v1 or v2, has
        # crashed quartus_map inside DMGR (dmgr_utility_body.cpp:2923) a few
        # minutes into the compile, including the db a successful cold build
        # had just written. Whatever the tar round-trip does to it, this
        # Quartus/Wine build cannot read it back, so the db paths are out and
        # every compile is cold. Bump the v2 prefix if this ever gets re-tried
        # -- a v2 tarball still carries fpga/db and would resurrect the crash.
        # output_files stays: a no-change incremental compile skips the
        # assembler entirely, and the upload step still needs sof/rbf/rpt --
        # the restored files are bit-identical to what the same db produces.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/output_files
          key: quartus-incdb-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quartus-incdb-v3-

      - name: Free disk space
        # 6 GB compressed image -- the default runner has ~14 GB usable,
        # so drop the preinstalled SDK cruft first.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Make workspace writable for the container user
        # The image runs Quartus as an unprivileged user whose uid does not
        # match the runner's, so the bind-mounted checkout must be open.
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u musiq-da --password-stdin

      - name: Pull Quartus Standard (Wine) image
        # -q: a 6 GB pull is hundreds of per-layer progress lines otherwise.
        run: docker pull -q ghcr.io/musiq-da/quartus-wine:18.1-slim

      - name: Stage license.dat and pin the container MAC to its HOSTID
        id: lic
        env:
          B64: ${{ secrets.QUARTUS_LICENSE_DAT }}
        run: |
          [ -n "$B64" ] || { echo "::error::secret QUARTUS_LICENSE_DAT is empty"; exit 1; }
          echo "$B64" | base64 -d > "$RUNNER_TEMP/license.dat"
          if grep -qE 'HOSTID=[0-9A-Fa-f]{12}' "$RUNNER_TEMP/license.dat"; then
            MAC_HEX=$(grep -oE 'HOSTID=[0-9A-Fa-f]{12}' "$RUNNER_TEMP/license.dat" | head -1 | cut -d= -f2 | tr a-f A-F)
          else
            MAC_HEX=0242AC110002
            LC_ALL=C sed -i.bak "s/HOSTID=[^[:space:]]*/HOSTID=$MAC_HEX/g" "$RUNNER_TEMP/license.dat"
          fi
          MAC=$(echo "$MAC_HEX" | sed 's/\(..\)/\1:/g; s/:$//' | tr A-F a-f)
          echo "mac=$MAC" >> "$GITHUB_OUTPUT"
          echo "license staged; container MAC: $MAC"

      - name: Compile (quartus_sh --flow compile, Wine)
        # Quartus's per-file/per-rule Info spam is thousands of lines; the
        # authoritative record is in output_files/*.rpt + *.smsg, which are
        # uploaded as artifacts. Keep Warnings, Errors and plain output.
        # The braced ||true guards grep's exit-1-on-no-match; pipefail still
        # propagates a docker/quartus failure.
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1-slim \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sh.exe" \
            --flow compile ap_core 2>&1 | { grep --line-buffered -vE '^\s*Info' || true; }

      - name: SDRAM interface is actually timed (not just "green")
        # The workspace is /work, which Wine exposes as Z:\work; the tcl
        # scripts therefore go in as Z:\work\scripts\*.tcl.
        if: always()
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1-slim \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sta.exe" \
            -t "Z:\\work\\scripts\\check_sdram_paths.tcl" ap_core \
            2>&1 | { grep --line-buffered -vE '^\s*Info' || true; }

      - name: Detailed STA of the CPU-domain violations
        # The summary panel shows the chipset clock at -27.9 ns with a TNS of
        # -29,331: thousands of paths the metal cannot close. The netlist is
        # right here with its database -- dump the worst of them, with full
        # node detail, so the fix has names.
        if: always()
        run: |
          docker run --rm --platform linux/amd64 \
            --mac-address "${{ steps.lic.outputs.mac }}" \
            -v "${{ github.workspace }}":/work \
            -v "$RUNNER_TEMP/license.dat":/license.dat:ro \
            -e LM_LICENSE_FILE='Z:\license.dat' \
            -e ALTERAD_LICENSE_FILE='Z:\license.dat' \
            -w /work/fpga \
            ghcr.io/musiq-da/quartus-wine:18.1-slim \
            "C:\\intelFPGA\\18.1\\quartus\\bin64\\quartus_sta.exe" \
            -t "Z:\\work\\scripts\\sta_cpu_paths.tcl" ap_core \
            2>&1 | { grep --line-buffered -vE '^\s*Info' || true; } || true
          ls -la fpga/sta_cpu*.txt fpga/sta_pico*.txt 2>/dev/null || true

      - name: Show fit summary
        if: always()
        run: |
          grep -A14 "Logic utilization" fpga/output_files/ap_core.fit.rpt 2>/dev/null | head -4 || true
          # The memory numbers matter as much as the ALMs here: the OSD
          # framebuffer and the softcore RAMs are M10K consumers, and every
          # decision about them needs the block count in the log rather than
          # a fifteen-minute compile to read it.
          grep -E "Total (registers|block memory bits|RAM Blocks|DSP Blocks|PLLs)" \
            fpga/output_files/ap_core.fit.rpt 2>/dev/null || true
          grep -iE "evaluation mode" fpga/output_files/*.smsg \
            fpga/output_files/*.rpt 2>/dev/null | head -5 || true
          ls -la fpga/output_files/ 2>/dev/null || true

      - name: Upload bitstream and reports
        # Licensed now: .sof/.rbf must be there -- a silent eval-mode
        # regression would otherwise pass with reports only. always(): a red
        # SDRAM gate must still hand us the reports that explain why.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quartus-std-bitstream
          if-no-files-found: error
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.rbf
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/output_files/*.smsg
            fpga/output_files/*.sta.rpt
            fpga/sta_cpu_*.txt
            fpga/sta_pico_*.txt
            fpga/sta_sdram_*.txt

      - name: Save incremental compile database
        # always(): a red SDRAM timing gate still leaves a perfectly good
        # post-fit db behind -- exactly the state the next fix wants to
        # resume from. fpga/db itself is not saved: the restored copies
        # crash quartus_map in DMGR every time (see the restore step).
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/output_files
          key: quartus-incdb-v3-${{ github.run_id }}-${{ github.run_attempt }}

  stage-quartus-win:
    # Lifts the Windows Quartus install out of the wine image once and
    # stashes it in actions/cache. The windows-2022 job below restores it
    # (~1 min) instead of an image it cannot run -- GHA windows runners
    # have no docker. Re-extract only runs when the cache is missing.
    runs-on: ubuntu-latest
    steps:
      - id: qinstall
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quartus-install
          key: quartus-install-win-v1

      - name: Extract intelFPGA from the wine image
        if: steps.qinstall.outputs.cache-hit != 'true'
        run: |
          docker pull -q ghcr.io/musiq-da/quartus-wine:18.1-slim
          cid=$(docker create ghcr.io/musiq-da/quartus-wine:18.1-slim)
          mkdir -p quartus-install
          docker cp "$cid":/opt/prefix/drive_c/intelFPGA quartus-install/intelFPGA
          docker rm -f "$cid"
          du -sh quartus-install/intelFPGA

      - name: Cache the Quartus install
        if: steps.qinstall.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quartus-install
          key: quartus-install-win-v1

  quartus-win:
    # The same Quartus Prime Standard 18.1 tree running on a real Windows
    # runner instead of under Wine. Motivation: quartus_map crashes (Fatal
    # access violation -> DMGR ref_count assert on the way out) whenever a
    # previous db exists under Wine, which killed db caching -- see the
    # quartus-std restore comment. Native Windows is Quartus's supported
    # platform for exactly that incremental-synthesis path, so the win db
    # cache here keeps fpga/db too.
    runs-on: windows-2022
    needs: stage-quartus-win
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the Quartus install
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quartus-install
          key: quartus-install-win-v1

      - name: Restore incremental compile database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/db
            fpga/incremental_db
            fpga/output_files
          key: quartus-incdb-win-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quartus-incdb-win-v1-

      - name: Stage license.dat for this machine's FlexLM hostid
        # shell: bash gives us Git Bash on the windows runner, so the same
        # decode + sed rewrite works as on ubuntu. Difference vs Wine: there
        # is no container MAC to pin, so instead of picking a MAC we ask
        # FlexLM itself -- lmutil lmhostid reports the id this machine will
        # present -- and rewrite the license's HOSTID placeholder to it.
        shell: bash
        run: |
          set -e
          LIC="$(cygpath "$RUNNER_TEMP")/license.dat"
          printf '%s' "${{ secrets.QUARTUS_LICENSE_DAT }}" | base64 -d > "$LIC"
          QBIN="$GITHUB_WORKSPACE/quartus-install/intelFPGA/18.1/quartus/bin64"
          "$QBIN/lmutil.exe" lmhostid | tee lmhostid.txt
          HOSTID_HEX=$(tr -d '\r' < lmhostid.txt | grep -oiE '[0-9a-f]{12}' | head -1)
          echo "FlexLM hostid = $HOSTID_HEX"
          test -n "$HOSTID_HEX"
          LC_ALL=C sed -i.bak \
            "s/HOSTID=[^[:space:]]*/HOSTID=$HOSTID_HEX/g" "$LIC"
          grep -c "HOSTID=$HOSTID_HEX" "$LIC"
          WIN_LIC="$(cygpath -w "$LIC")"
          {
            echo "LM_LICENSE_FILE=$WIN_LIC"
            echo "ALTERAD_LICENSE_FILE=$WIN_LIC"
            echo "QUARTUS_ROOTDIR=$(cygpath -w "$GITHUB_WORKSPACE/quartus-install/intelFPGA/18.1/quartus")"
          } >> "$GITHUB_ENV"
          cygpath -w "$QBIN" >> "$GITHUB_PATH"

      - name: Quartus smoke test
        shell: bash
        run: quartus_sh.exe --version

      - name: Compile (quartus_sh --flow compile)
        shell: bash
        run: |
          cd fpga
          quartus_sh.exe --flow compile ap_core \
            2>&1 | { grep --line-buffered -vE '^\s*Info' || true; }

      - name: SDRAM interface is actually timed (not just "green")
        if: always()
        shell: bash
        run: |
          cd fpga
          quartus_sta.exe \
            -t "$(cygpath -w "$GITHUB_WORKSPACE/scripts/check_sdram_paths.tcl")" \
            ap_core 2>&1 | { grep --line-buffered -vE '^\s*Info' || true; }

      - name: Detailed STA of the CPU-domain violations
        if: always()
        shell: bash
        run: |
          cd fpga
          quartus_sta.exe \
            -t "$(cygpath -w "$GITHUB_WORKSPACE/scripts/sta_cpu_paths.tcl")" \
            ap_core 2>&1 | { grep --line-buffered -vE '^\s*Info' || true; } || true
          ls -la fpga/sta_cpu*.txt fpga/sta_pico*.txt 2>/dev/null || true

      - name: Show fit summary
        if: always()
        shell: bash
        run: |
          grep -A14 "Logic utilization" fpga/output_files/ap_core.fit.rpt 2>/dev/null | head -4 || true
          grep -E "Flow Status|Successful|failed" \
            fpga/output_files/ap_core.fit.rpt 2>/dev/null || true
          grep -iE "evaluation mode" fpga/output_files/*.smsg \
            fpga/output_files/*.rpt 2>/dev/null | head -5 || true
          ls -la fpga/output_files/ 2>/dev/null || true

      - name: Upload bitstream and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quartus-win-bitstream
          if-no-files-found: error
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.rbf
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/output_files/*.smsg
            fpga/output_files/*.sta.rpt
            fpga/sta_cpu_*.txt
            fpga/sta_pico_*.txt
            fpga/sta_sdram_*.txt

      - name: Save incremental compile database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fpga/db
            fpga/incremental_db
            fpga/output_files
          key: quartus-incdb-win-v1-${{ github.run_id }}-${{ github.run_attempt }}
