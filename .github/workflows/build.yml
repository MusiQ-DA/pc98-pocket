name: build

on:
  push:
    branches: [main, debug-jtag, zet-cpu]
    # Docs-only commits don't change the bitstream; skip the 20-minute
    # Quartus build for them. CI config itself still triggers.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'NOTICE.md'
  workflow_dispatch:

# A newer push on the same ref supersedes a running build -- the old
# bitstream would never be fetched anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# permissions stay minimal: every job only reads.
permissions:
  contents: read
  packages: read

jobs:

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Core elaborates — no implicit nets, no undeclared names
        # Quartus carries default_nettype none into core_top, so an undeclared
        # name is a hard error there and a fifteen-minute compile dies; the
        # sims never compile core_top or the CHIPSET at all, and Verilator
        # itself only warns (%Warning-IMPLICIT).  Two Quartus runs and one
        # silently-dead TVRAM later, this is the gate.
        run: ./scripts/lint_core.sh

      - name: Option ROMs — XROM and SCSI windows decode on the real Chipset
        # Both benches drive guest reads at the Chipset's memory pins and
        # check the low AND high data lanes, so they elaborate the whole
        # core: the signature's odd byte rides the high lane, which is the
        # failure mode the POST scan would hit first.
        run: ./scripts/sim_roms.sh

      - name: scsi_rom.hex is the assembled scsi_rom.asm, not a stale image
        run: |
          sudo apt-get update && sudo apt-get install -y nasm
          ./scripts/check_scsi_rom.sh

      - name: SDRAM controller — integrity and single-port bandwidth
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_mp \
            -Isim -Ifpga/core \
            sim/tb_sdram_mp.sv sim/sdram_model.sv \
            fpga/core/sdram_mp.sv \
            -o tb --Mdir obj_mp
          ./obj_mp/tb | tee mp.log
          grep -q "RESULT: PASS" mp.log

      - name: SDRAM controller — three-port contention bandwidth
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_load \
            -Isim -Ifpga/core \
            sim/tb_sdram_load.sv sim/sdram_model.sv \
            fpga/core/sdram_mp.sv \
            -o tbl --Mdir obj_load
          ./obj_load/tbl | tee load.log
          grep -q "RESULT: PASS" load.log
      - name: SDRAM controller — shim handshake
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_sdram_shim \
            -Isim -Ifpga/core \
            sim/tb_sdram_shim.sv sim/sdram_model.sv \
            fpga/core/sdram_shim.sv \
            fpga/core/sdram_mp.sv \
            -o tbs --Mdir obj_shim
          ./obj_shim/tbs | tee shim.log
          grep -q "RESULT: PASS" shim.log

      - name: RAM.sv integration — sdram_mp
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_ram_ab \
            -Isim -I$S -I$S/chipset/HDL \
            sim/tb_ram_ab.sv sim/sdram_model.sv \
            $S/chipset/HDL/RAM.sv $S/sdram_shim.sv $S/sdram_mp.sv \
            -o r --Mdir obj_ram_ab
          ./obj_ram_ab/r | tee ram_ab.log
          grep -q "RESULT: PASS" ram_ab.log

      - name: RAM.sv DMA-strobe regression — held writes, phase swept
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_ram_dma_wr \
            -Isim -I$S -I$S/chipset/HDL \
            sim/tb_ram_dma_wr.sv sim/sdram_model.sv \
            $S/chipset/HDL/RAM.sv $S/sdram_shim.sv $S/sdram_mp.sv \
            -o r --Mdir obj_dma
          ./obj_dma/r | tee dma.log
          grep -q "=== PASS ===" dma.log

      - name: NEC-style EMS board — 08E1-08E9 windows bank into SDRAM
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_ems98 \
            -Isim -I$S -I$S/chipset/HDL \
            sim/tb_pc98_ems98.sv sim/sdram_model.sv \
            $S/chipset/HDL/RAM.sv $S/pc98_ems98.sv \
            $S/sdram_shim.sv $S/sdram_mp.sv \
            -o e --Mdir obj_ems
          ./obj_ems/e | tee ems.log
          grep -q "RESULT: PASS" ems.log

      - name: RTC rollover equivalence — pipelined vs nested cascade
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_rtc_roll \
            -Isim sim/tb_rtc_roll.sv -o rtc --Mdir obj_rtc
          ./obj_rtc/rtc | tee rtc.log
          grep -q "=== PASS ===" rtc.log

      - name: ROM image lands where it should (no address folding)
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_bios_map \
            -Isim sim/tb_bios_map.sv -o m --Mdir obj_map
          ./obj_map/m | tee map.log
          grep -q "RESULT: PASS" map.log

      - name: TVRAM keeps characters and attributes apart
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_tvram \
            -Isim -Ifpga/core \
            sim/tb_pc98_tvram.sv fpga/core/pc98_tvram.sv \
            -o v --Mdir obj_tv
          ./obj_tv/v | tee tv.log
          grep -q "RESULT: PASS" tv.log

      - name: the CG window serves a glyph to the guest
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_cgwindow \
            -Isim -I$S sim/tb_pc98_cgwindow.sv \
            $S/pc98_cgwindow.sv $S/pc98_glyph_addr.sv $S/pc98_gaiji_ram.sv \
            -o c --Mdir obj_cg
          ./obj_cg/c | tee cg.log
          grep -q "RESULT: PASS" cg.log

      - name: a pulse survives the clock crossing
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pulse_cdc \
            -Isim -Ifpga/core \
            sim/tb_pulse_cdc.sv fpga/core/pulse_cdc.sv \
            -o p --Mdir obj_cdc
          ./obj_cdc/p | tee cdc.log
          grep -q "RESULT: PASS" cdc.log

      - name: glyphs come back out of SDRAM intact
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_font_sdram \
            -Isim -I$S sim/tb_pc98_font_sdram.sv sim/sdram_model.sv \
            $S/pc98_glyph_rowbuf.sv $S/pc98_glyph_addr.sv $S/pc98_gaiji_ram.sv \
            $S/pc98_font_fetch.sv $S/sdram_mp.sv \
            -o f --Mdir obj_fs
          ./obj_fs/f | tee fs.log
          grep -q "RESULT: PASS" fs.log

      - name: the font port survives full contention
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_font_stress \
            -Isim -I$S sim/tb_pc98_font_stress.sv sim/sdram_model.sv \
            $S/pc98_glyph_rowbuf.sv $S/pc98_glyph_addr.sv $S/pc98_gaiji_ram.sv \
            $S/pc98_font_fetch.sv $S/sdram_mp.sv \
            -o s --Mdir obj_fstress
          ./obj_fstress/s | tee fstress.log
          grep -q "RESULT: PASS" fstress.log

      - name: guest bus writes reach the screen as pixels, whole path real
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_pipeline \
            -Isim -I$S sim/tb_pc98_pipeline.sv sim/sdram_model.sv \
            $S/pc98_tvram.sv $S/pc98_glyph_rowbuf.sv $S/pc98_glyph_addr.sv \
            $S/pc98_gaiji_ram.sv $S/pc98_font_ank.sv $S/pc98_font_fetch.sv \
            $S/sdram_mp.sv \
            $S/pc98_text_render.sv $S/pc98_video_timing.sv $S/pulse_cdc.sv \
            -o p --Mdir obj_pipe
          ./obj_pipe/p | tee pipe.log
          grep -q "RESULT: PASS" pipe.log

      - name: a text row's glyphs land in the buffer, kanji paired
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_rowbuf \
            -Isim -Ifpga/core sim/tb_pc98_rowbuf.sv \
            fpga/core/pc98_glyph_rowbuf.sv \
            fpga/core/pc98_glyph_addr.sv fpga/core/pc98_gaiji_ram.sv \
            fpga/core/pc98_font_ank.sv \
            -o b --Mdir obj_rb
          ./obj_rb/b | tee rb.log
          grep -q "RESULT: PASS" rb.log

      - name: glyph addresses match a real FONT.ROM
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_glyph_addr \
            -Isim -Ifpga/core \
            sim/tb_pc98_glyph_addr.sv fpga/core/pc98_glyph_addr.sv \
            -o g --Mdir obj_ga
          ./obj_ga/g | tee ga.log
          grep -q "RESULT: PASS" ga.log

      - name: port 0x68 drives the ANK/kanji mode the row buffer honours
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gdc_mode1 \
            -Isim -Ifpga/core \
            sim/tb_pc98_gdc_mode1.sv fpga/core/pc98_gdc_mode1.sv \
            -o m --Mdir obj_m1
          ./obj_m1/m | tee m1.log
          grep -q "RESULT: PASS" m1.log

      - name: port 0x6A takes the bit form and the 0x82-0x85 clock commands
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gdc_mode2 \
            -Isim -Ifpga/core \
            sim/tb_pc98_gdc_mode2.sv fpga/core/pc98_gdc_mode2.sv \
            -o m --Mdir obj_m2
          ./obj_m2/m | tee m2.log
          grep -q "RESULT: PASS" m2.log

      - name: raster is the 640x400 one PC-98 software expects
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_timing \
            -Isim -Ifpga/core \
            sim/tb_pc98_timing.sv fpga/core/pc98_video_timing.sv \
            -o r --Mdir obj_ti
          ./obj_ti/r | tee ti.log
          grep -q "RESULT: PASS" ti.log

      - name: the OSD's coordinates reach the OSD's window
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_osdwin \
            -Isim -I$S sim/tb_pc98_osdwin.sv \
            $S/pocket_video.sv $S/pc98_video_timing.sv \
            fpga/apf/common.v \
            -o w --Mdir obj_ow
          ./obj_ow/w | tee ow.log
          grep -q "^PASS" ow.log

      - name: text plane draws what TVRAM says
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_text \
            -Isim -Ifpga/core \
            sim/tb_pc98_text.sv fpga/core/pc98_text_render.sv \
            -o x --Mdir obj_tx
          ./obj_tx/x | tee tx.log
          grep -q "RESULT: PASS" tx.log

      - name: the first cell of a line is drawn, not lost to the blanking
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_firstcell \
            -Isim -Ifpga/core \
            sim/tb_pc98_firstcell.sv fpga/core/pc98_text_render.sv \
            -o q --Mdir obj_fc
          ./obj_fc/q | tee fc.log
          grep -q "RESULT: PASS" fc.log

      - name: the boot beep reaches the speaker pin (ctr1, sysport bit3)
        run: |
          H=fpga/core/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_beep \
            -Isim -I$H/i8253/HDL \
            sim/tb_pc98_beep.sv \
            $H/i8253/HDL/i8253.sv $H/i8253/HDL/i8253_Control_Logic.sv \
            $H/i8253/HDL/i8253_Counter.sv \
            -o b --Mdir obj_beep
          ./obj_beep/b | tee beep.log
          grep -q "RESULT: PASS" beep.log

      - name: Set-2 keys translate to PC-98 make/break codes
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_kbd_ps2 \
            -Isim -Ifpga/core \
            sim/tb_pc98_kbd_ps2.sv fpga/core/pc98_kbd_ps2.sv \
            -o k --Mdir obj_kb
          ./obj_kb/k | tee kb.log
          grep -q "RESULT: PASS" kb.log

      - name: Docked USB keyboard reports become Set-2 events
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_hid_to_ps2 \
            -Isim -Ifpga/core \
            sim/tb_hid_to_ps2.sv fpga/core/hid_to_ps2.sv \
            -o h --Mdir obj_hid
          ./obj_hid/h | tee hid.log
          grep -q "RESULT: PASS" hid.log

      - name: ITF bank switches on 0x043D and not on a glitch
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_itf_bank \
            -Isim sim/tb_itf_bank.sv -o t --Mdir obj_itf
          ./obj_itf/t | tee itf.log
          grep -q "RESULT: PASS" itf.log

      - name: keyboard 8251 answers the way the ROMs ask
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_kbd8251 \
            -Isim -Ifpga/core \
            sim/tb_pc98_kbd8251.sv fpga/core/pc98_kbd8251.sv \
            -o k --Mdir obj_kbd
          ./obj_kbd/k | tee kbd.log
          grep -q "RESULT: PASS" kbd.log

      - name: JTAG probe writes reach the 8251 as keystrokes
        run: |
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_jtag_key \
            -Isim -Ifpga/core \
            sim/tb_pc98_jtag_key.sv fpga/core/pc98_jtag_probe.sv \
            fpga/core/pc98_key_inject.sv fpga/core/pc98_kbd8251.sv \
            -o jk --Mdir obj_jk
          ./obj_jk/jk | tee jk.log
          grep -q "RESULT: PASS" jk.log

      - name: the V30 rides the 8288 world through the bridge (fast memory)
        run: |
          # v30u_ucrom $readmemh's its tables from HEXDIR "hdl/rtl/ucore/"
          # relative to the working directory; stage them (an empty ROM is
          # a $fatal inside the core, not a warning).
          mkdir -p hdl/rtl/ucore
          cp fpga/core/v30/ucrom.hex \
             fpga/core/v30/ucdecode.hex hdl/rtl/ucore/
          S=fpga/core
          K=$S/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_v30_bridge \
            -Isim -I$S -I$S/v30 -I$K -I$K/i8288/HDL -I$K/i8259/HDL \
            sim/tb_v30_bridge.sv \
            $S/v30/v30u_ss_pkg.sv $S/v30/v30_core.sv $S/v30/v30u_biu.sv \
            $S/v30/v30u_eu.sv $S/v30/v30u_ucrom.sv \
            $S/v30_cpu_bridge.sv \
            $K/ce_generator.sv $K/i8288/HDL/i8288.sv $K/Ready.sv \
            $K/i8259/HDL/i8259.sv $K/i8259/HDL/i8259_Bus_Control_Logic.sv \
            $K/i8259/HDL/i8259_Control_Logic.sv $K/i8259/HDL/i8259_In_Service.sv \
            $K/i8259/HDL/i8259_Interrupt_Request.sv \
            $K/i8259/HDL/i8259_Priority_Resolver.sv \
            -o v --Mdir obj_v30br
          ./obj_v30br/v +slow=0 | tee v30br.log
          grep -q "RESULT: PASS" v30br.log

      - name: the V30 rides the 8288 world through the bridge (wait states)
        run: |
          ./obj_v30br/v +slow=12 | tee v30br_slow.log
          grep -q "RESULT: PASS" v30br_slow.log

      - name: a bare V30's T2 sample still lands after the FDC answers
        run: |
          # The nuV30 latches ad_i at T2->T3, as early as two clk_chipset
          # after io_read_command_n falls.  If a peripheral's read answer is
          # staged deeper than that the CPU reads the previous byte -- this
          # is the race that made the BIOS's seek drain see a phantom
          # "not busy" and wedge.  The bench runs SPECIFY/RECALIBRATE x4/
          # SENSE-drain through the real core + 8288 + glue + floppy and
          # checks every byte the program stored.
          S=fpga/core
          K=$S/chipset/HDL
          V=$S/v30
          mkdir -p hdl/rtl/ucore && cp $V/ucrom.hex $V/ucdecode.hex hdl/rtl/ucore/
          verilator --binary --timing -Wno-fatal --top-module tb_v30_fdcrd \
            -Isim -I$S -I$V -I$K -I$K/i8288/HDL \
            sim/tb_v30_fdcrd.sv \
            $V/v30u_ss_pkg.sv $V/v30_core.sv $V/v30u_biu.sv $V/v30u_eu.sv \
            $V/v30u_ucrom.sv $S/pc98_fdc_glue.sv \
            $S/common/floppy.v $S/common/simple_fifo.v \
            $K/ce_generator.sv $K/i8288/HDL/i8288.sv \
            -o fdcrd --Mdir obj_fdcrd
          ./obj_fdcrd/fdcrd | tee fdcrd.log
          grep -q "RESULT: PASS" fdcrd.log

      - name: the virtual keyboard's tables are sane
        run: python3 scripts/check_vkb_layout.py

      - name: no module input left dangling in core_top
        run: python3 scripts/check_unconnected.py

      - name: IRQ0 is an edge, not a level, on a timer pin latched high
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          for tb in tb_pic_irq0_edge tb_pit_boot_seq tb_pic_cascade; do
            verilator --binary --timing -Wno-fatal --top-module $tb \
              -Isim -I$S -I$H -I$H/i8253/HDL -I$H/i8259/HDL \
              sim/$tb.sv -o e --Mdir obj_$tb
            ./obj_$tb/e | tee $tb.log
            grep -q "RESULT: PASS\|PASS tb_" $tb.log
          done

      - name: V30 read timing at the real CE rates
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_cpu_timing \
            -Isim -I$S -I$H \
            sim/tb_cpu_timing.sv sim/sdram_board_model.sv sim/sdram_model.sv \
            $H/RAM.sv $H/ce_generator.sv $S/sdram_shim.sv $S/sdram_mp.sv \
            -o c --Mdir obj_ct
          ./obj_ct/c | tee ct.log
          grep -q "RESULT: PASS" ct.log

      - name: the V30 on the real memory path, at every CE index
        run: |
          S=fpga/core
          H=$S/chipset/HDL
          V=$S/v30
          mkdir -p hdl/rtl/ucore && cp $V/ucrom.hex $V/ucdecode.hex hdl/rtl/ucore/
          verilator --binary --timing -Wno-fatal --top-module tb_v30_mem \
            +define+V30_BACKDOOR \
            -O2 -Isim -I$S -I$V -I$H -I$H/i8288/HDL \
            sim/tb_v30_mem.sv \
            $V/v30u_ss_pkg.sv $V/v30_core.sv $V/v30u_biu.sv $V/v30u_eu.sv \
            $V/v30u_ucrom.sv $S/v30_cpu_bridge.sv \
            $S/sdram_shim.sv $S/sdram_mp.sv \
            sim/sdram_board_model.sv sim/sdram_model.sv \
            $H/RAM.sv $H/Ready.sv $H/ce_generator.sv $H/i8288/HDL/i8288.sv \
            -o vm --Mdir obj_vm
          for sp in 0 1 2 3; do
            ./obj_vm/vm +speed=$sp | tee vm_$sp.log
            grep -q "PASS tb_v30_mem" vm_$sp.log
          done

      - name: the GDC puts parameters where np21w puts them
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gdc \
            -Isim -I$S sim/tb_pc98_gdc.sv $S/pc98_gdc.sv -o g --Mdir obj_gdc
          ./obj_gdc/g | tee gdc.log
          grep -q "PASS tb_pc98_gdc" gdc.log

      - name: the PC-98 FDC ports land on floppy.v's register file
        run: |
          S=fpga/core
          # -I$S/common because the bench now instantiates the REAL floppy.v
          # and drives the BIOS's own sequence through it, rather than checking
          # the mapping against an imagined controller.
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_fdc_glue \
            -Isim -I$S -I$S/common \
            sim/tb_pc98_fdc_glue.sv $S/pc98_fdc_glue.sv \
            sim/tb_fdd_dma_model.sv -o fg --Mdir obj_fdcglue
          ./obj_fdcglue/fg | tee fdcglue.log
          grep -q "PASS tb_pc98_fdc_glue" fdcglue.log

      - name: RAM-image serve keeps sector bytes in order under firmware mgmt traffic
        run: |
          S=fpga/core
          # The whole serve chain with the real arbiter: fdd_ramimg pushes
          # FIFO bytes through the management bus while a firmware-traffic
          # generator lands non-F2 reads on the push cycles. Without the
          # mgmt_arb strobe fence those reads arrive as nibble-F FIFO pops
          # and the guest receives the sector rotated -- the regression this
          # step locks out.
          verilator --binary --timing -Wno-fatal --top-module tb_ramimg_fdc \
            -Isim \
            $S/common/floppy.v $S/common/simple_fifo.v \
            $S/mgmt_arb.sv $S/fdd_ramimg.sv \
            sim/stub_dcfifo.sv sim/tb_fdd_dma_model.sv \
            sim/tb_ramimg_fdc.sv -o rf --Mdir obj_ramimgfdc
          ./obj_ramimgfdc/rf | tee ramimgfdc.log
          grep -q "PASS tb_ramimg_fdc" ramimgfdc.log

      - name: the SCSI register window indexes and increments like the board
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_scsi \
            -Isim -I$S sim/tb_pc98_scsi.sv $S/pc98_scsi.sv -o sc --Mdir obj_scsi
          ./obj_scsi/sc | tee scsi.log
          grep -q "PASS tb_pc98_scsi" scsi.log

      - name: the bus mouse's second 8255 matches np21w's mouseif
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_busmouse \
            -Isim -I$S sim/tb_pc98_busmouse.sv $S/pc98_busmouse.sv -o bm --Mdir obj_bm
          ./obj_bm/bm | tee bm.log
          grep -q "RESULT: PASS" bm.log

      - name: the mouse source captures, scales and merges correctly
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_mousesrc \
            -Isim -I$S sim/tb_pc98_mousesrc.sv $S/pc98_mouse_src.sv \
            -o ms --Mdir obj_ms
          ./obj_ms/ms | tee ms.log
          grep -q "RESULT: PASS" ms.log

      - name: the OPNA's port window and register router match np21w
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_opna \
            -Isim -I$S -I$S/sound/jt12/hdl -I$S/sound/jt12/hdl/adpcm \
            -I$S/sound/jt12/jt49/hdl \
            sim/tb_pc98_opna.sv $S/pc98_opna.sv -o op --Mdir obj_opna
          ./obj_opna/op | tee opna.log
          grep -q "PASS tb_pc98_opna" opna.log

      - name: the firmware ADPCM-A encoder matches the packer bit for bit
        run: |
          python3 scripts/rhythm_enc_test.py

      - name: the fddsnd.bin header parse matches the packer's layout
        run: |
          python3 scripts/fddsnd_hdr_test.py

      - name: the GRCG's three operations match np21w's expressions
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_grcg \
            -Isim -I$S sim/tb_pc98_grcg.sv $S/pc98_grcg.sv -o gr --Mdir obj_grcg
          ./obj_grcg/gr | tee grcg.log
          grep -q "PASS tb_pc98_grcg" grcg.log

      - name: one guest GVRAM access becomes the right several to memory
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gvram_seq \
            -Isim -I$S sim/tb_pc98_gvram_seq.sv $S/pc98_gvram_seq.sv \
            $S/pc98_egc.sv -o gs --Mdir obj_gseq
          ./obj_gseq/gs | tee gseq.log
          grep -q "PASS tb_pc98_gvram_seq" gseq.log

      - name: the graphics fetch shows what the slave GDC's partitions say
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_gvram_display \
            -Isim -I$S sim/tb_pc98_gvram_display.sv $S/pc98_gvram_display.sv \
            -o gd --Mdir obj_gdisp
          ./obj_gdisp/gd | tee gdisp.log
          grep -q "PASS tb_pc98_gvram_display" gdisp.log

      - name: the EGC's colour, raster ops and access page match np21w
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_pc98_egc \
            -Isim -I$S sim/tb_pc98_egc.sv $S/pc98_gvram_seq.sv \
            $S/pc98_egc.sv -o eg --Mdir obj_egc
          ./obj_egc/eg | tee egc.log
          grep -q "PASS tb_pc98_egc" egc.log

      - name: CE generator makes the frequencies the speed menu names
        run: |
          H=fpga/core/chipset/HDL
          verilator --binary --timing -Wno-fatal --top-module tb_ce_rates \
            -Isim -I$H sim/tb_ce_rates.sv $H/ce_generator.sv \
            -o ce --Mdir obj_ce
          ./obj_ce/ce | tee ce.log
          grep -q "PASS tb_ce_rates" ce.log

      - name: RAM.sv integration at board timing (antiphase device clock)
        run: |
          S=fpga/core
          verilator --binary --timing -Wno-fatal --top-module tb_ram_ab_ph \
            -Isim -I$S -I$S/chipset/HDL \
            sim/tb_ram_ab_ph.sv sim/sdram_model.sv sim/sdram_board_model.sv \
            $S/chipset/HDL/RAM.sv $S/sdram_shim.sv $S/sdram_mp.sv \
            -o p --Mdir obj_ph
          ./obj_ph/p | tee ram_ph.log
          grep -q "RESULT: PASS" ram_ph.log

  firmware:
    # firmware.vh is committed and the Quartus build $readmemh's it, so nothing
    # rebuilds it automatically: edit the C, forget to run make, and the
    # bitstream silently ships a stale softcore ROM.
    #
    # What this job still proves: the firmware compiles and links under the
    # runner's clang, and the image carries no div/rem -- the softcore is
    # ENABLE_MUL(1)/ENABLE_DIV(0), so one would be an illegal-instruction
    # trap. -march=rv32i_zmmul puts div outside the ISA entirely (a stray `/`
    # fails at ld.lld, not on hardware), which is also what keeps instruction
    # selection identical between this clang and the Homebrew LLVM the
    # committed image is built with; nodiv-verify disassembles to prove it.
    # The runner's clang comes without lld, so install the linker and the
    # LLVM binutils or the job dies at the link.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM linker and binutils
        run: sudo apt-get update && sudo apt-get install -y lld llvm

      - name: firmware builds with no div/rem -- the softcore has no divider
        run: make -C firmware nodiv-verify

  quartus:
    # Quartus Prime Lite in the raetro/quartus:pocket image -- THE bitstream
    # build. Lite covers this Cyclone V and needs no license file, so the
    # staging job, the ghcr wine image, the FlexLM hostid dance and the
    # Windows runner all go away. The quartus-win job this replaces kept
    # crashing quartus_map/quartus_fit with access violations; a Linux
    # container is Quartus's saner home anyway. The incremental-db cache
    # is deliberately NOT carried over: a restored db pinned partitions
    # badly enough to inflate the fitter count past the device twice in
    # one day (170012 at 1850-1880 against a ~1800-LAB design). A clean
    # compile is slower but always means what it says.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build_id_gen.tcl stamps the MIF with the last commit touching
          # fpga/ or firmware/; a depth-1 clone cannot see past HEAD.
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true

      - name: Pull Quartus image
        run: docker pull raetro/quartus:pocket

      - name: Compile (quartus_sh --flow compile)
        id: compile
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/fpga \
            raetro/quartus:pocket bash -lc '
              set -e
              Q=""
              for p in /opt/intelFPGA/quartus /opt/quartus /usr/local/quartus /opt/intelFPGA_lite /opt/altera; do
                f=$(find "$p" -maxdepth 3 -name quartus_sh 2>/dev/null | head -1)
                if [ -n "$f" ]; then Q=$(dirname "$f"); break; fi
              done
              if [ -z "$Q" ]; then echo "ERROR: quartus_sh not found"; exit 1; fi
              echo "using quartus at $Q"
              export PATH="$Q:$PATH"
              export LD_LIBRARY_PATH="$Q:${LD_LIBRARY_PATH:-}"
              quartus_sh --version
              # pipefail: the compile exit status flows through tee/grep --
              # the old pipeline reported "success" through a failed fitter
              # and let the STA step trip over the missing netlist instead.
              # NOTE: no apostrophes inside this single-quoted bash -lc block;
              # one ends the quote early and the host shell eats the rest.
              set -o pipefail
              # Internal/Fatal Errors are flaky and do not reproduce on
              # retry; unfittable designs and HDL errors are deterministic
              # and must not be retried into a second identical failure.
              for attempt in 1 2; do
                if quartus_sh --flow compile ap_core 2>&1 \
                     | tee "compile_$attempt.log" \
                     | { grep --line-buffered -vE "^\s*Info" || true; }; then
                  break
                fi
                [ "$attempt" = 2 ] && exit 1
                grep -qE "Internal Error|Fatal Error" "compile_$attempt.log" || exit 1
                echo "::warning::quartus internal error on attempt $attempt; retrying"
              done
            '

      - name: SDRAM interface is actually timed (not just "green")
        if: always()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/fpga \
            -v "$GITHUB_WORKSPACE/scripts":/repo-scripts:ro \
            raetro/quartus:pocket bash -lc '
              set -e
              Q=""
              for p in /opt/intelFPGA/quartus /opt/quartus /usr/local/quartus /opt/intelFPGA_lite /opt/altera; do
                f=$(find "$p" -maxdepth 3 -name quartus_sta 2>/dev/null | head -1)
                if [ -n "$f" ]; then Q=$(dirname "$f"); break; fi
              done
              if [ -z "$Q" ]; then echo "ERROR: quartus_sta not found"; exit 1; fi
              export PATH="$Q:$PATH"
              export LD_LIBRARY_PATH="$Q:${LD_LIBRARY_PATH:-}"
              quartus_sta -t /repo-scripts/check_sdram_paths.tcl ap_core
            '

      - name: Detailed STA of the CPU-domain violations
        if: always()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/fpga \
            -v "$GITHUB_WORKSPACE/scripts":/repo-scripts:ro \
            raetro/quartus:pocket bash -lc '
              set -e
              Q=""
              for p in /opt/intelFPGA/quartus /opt/quartus /usr/local/quartus /opt/intelFPGA_lite /opt/altera; do
                f=$(find "$p" -maxdepth 3 -name quartus_sta 2>/dev/null | head -1)
                if [ -n "$f" ]; then Q=$(dirname "$f"); break; fi
              done
              export PATH="$Q:$PATH"
              export LD_LIBRARY_PATH="$Q:${LD_LIBRARY_PATH:-}"
              quartus_sta -t /repo-scripts/sta_cpu_paths.tcl ap_core || true
              quartus_sta -t /repo-scripts/sta_74a_paths.tcl ap_core || true
              ls -la sta_*.txt 2>/dev/null || true
            '

      - name: Show fit summary
        if: always()
        run: |
          grep -A14 "Logic utilization" fpga/output_files/ap_core.fit.rpt 2>/dev/null | head -4 || true
          grep -E "Total (registers|block memory bits|RAM Blocks|DSP Blocks|PLLs)" \
            fpga/output_files/ap_core.fit.rpt 2>/dev/null || true
          grep -E "Flow Status|Successful|failed" \
            fpga/output_files/ap_core.fit.rpt 2>/dev/null || true
          ls -la fpga/output_files/ 2>/dev/null || true

      - name: Upload bitstream and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitstream
          if-no-files-found: error
          path: |
            fpga/output_files/*.sof
            fpga/output_files/*.rbf
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/output_files/*.smsg
            fpga/output_files/*.sta.rpt
            fpga/sta_cpu_*.txt
            fpga/sta_pico_*.txt
            fpga/sta_sdram_*.txt
            fpga/sta_74a_*.txt
