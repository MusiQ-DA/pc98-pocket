# jtag_probe.cfg -- openocd side of the pc98_jtag_probe SLD node.
#
# Usage:  openocd -f scripts/jtag_probe.cfg -f scripts/jtag_probe_read.tcl
# Or interactively: openocd -f scripts/jtag_probe.cfg, then telnet 4444.
#
# The FPGA sits alone on the chain: Cyclone V 5CE?A4, idcode 0x02b050dd,
# 10-bit IR. USER1 selects an SLD node's virtual IR; USER0 shifts its DR.

source [find interface/altera-usb-blaster.cfg]
adapter speed 6000

jtag newtap fpga tap -irlen 10 -ircapture 0x1 -irmask 0x3 -expected-id 0x02b050dd
